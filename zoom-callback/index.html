<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bundle · Zoom</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 48px 24px; text-align: center; background: #fff; color: #1c1c1e; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f2f2f7; } }
  a { color: #0a84ff; }
</style>
</head>
<body>
<p>Returning to Bundle…</p>
<p><a id="open" href="#">Open Bundle</a></p>
<script>
  // Zoom only redirects to https; hand the sign-in result to the app's own scheme.
  var target = "bundlezoom://oauth" + window.location.search;
  document.getElementById("open").href = target;
  window.location.replace(target);
</script>
</body>
</html>
